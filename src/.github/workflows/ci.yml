name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Warehouse.sln
      - run: dotnet build Warehouse.sln -c Release --no-restore
      - run: dotnet test Warehouse.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
